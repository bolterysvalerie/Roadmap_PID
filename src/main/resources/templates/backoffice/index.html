<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"

      layout:decorate="~{layouts/main}">
<head>
    <title>Back-office</title>
</head>
<body>

<!--            <li><a th:href="@{/locations}">Gérer les lieux</a></li>-->
            <!-- Ajoute d'autres sections ici si nécessaire -->
